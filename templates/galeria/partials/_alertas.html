{% if messages %}
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div style="display: flex; align-items: center; gap: 12px; background-color: #2D0F17; border: 2px solid #FF3366; box-shadow: 0 0 15px rgba(255, 51, 102, 0.4); border-radius: 10px; padding: 12px 20px; margin: 1.5rem 0;">
                <span style="background-color: #FF3366; color: #FFFFFF; font-weight: bold; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 0 10px #FF3366; flex-shrink: 0;">✕</span>
                <span style="color: #FFFFFF; font-size: 1rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif;">{{ message }}</span>
            </div>
        {% else %}
            <div style="display: flex; align-items: center; gap: 12px; background-color: #071D3A; border: 2px solid #00FF88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); border-radius: 10px; padding: 12px 20px; margin: 1.5rem 0;">
                <span style="background-color: #00FF88; color: #041833; font-weight: bold; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 0 10px #00FF88; flex-shrink: 0;">✓</span>
                <span style="color: #FFFFFF; font-size: 1rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif;">{{ message }}</span>
            </div>
        {% endif %}
    {% endfor %}
{% endif %}
