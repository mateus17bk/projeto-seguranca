{% load static %}
<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Alura Space</title>

    <!-- Bootstrap 5 CSS -->
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>

    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='{% static 'styles/style.css' %}?v=1.1'>
</head>

<body class='bg-dark'>
    <div class='pagina-inicial'>
        <header class='cabecalho'>
            <a href='{% url 'index' %}'>
                <img src='{% static 'assets/logo/Logo(2).png' %}' alt='Logo da Alura Space' />
            </a>
            <div class='cabecalho__busca'>
                <div class='busca__fundo'>
                    <form action='{% url 'buscar' %}' method='GET'>
                        <input class='busca__input' type='text' name='buscar' placeholder='O que você procura?' value='{{ termo_busca|default:'' }}'>
                        <button type='submit' style='background: transparent; border: none; cursor: pointer;'>
                            <img class='busca__icone' src='{% static 'assets/icones/1x/search.png' %}' alt='ícone de search'>
                        </button>
                    </form>
                </div>
            </div>
        </header>

        {% include 'galeria/partials/_alertas.html' %}

        <main class='principal'>
            {% include 'galeria/partials/_menu.html' %}
            {% block content %}
            {% endblock %}
        </main>
    </div>
    {% include 'galeria/partials/_footer.html' %}

    <!-- Bootstrap 5 JS -->
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
</body>

</html>
