{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>

<body>
    <div class="pagina-inicial">
        <header class="cabecalho">
            <img src="{% static 'assets/logo/Logo(2).png' %}" alt="Logo da Alura Space" />
            {% for message in messages %}
                <div style="display: inline-flex; align-items: center; gap: 12px; background-color: #071D3A; border: 2px solid #00FF88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); border-radius: 10px; padding: 12px 20px; margin: 1.5rem 0;">
                    <span style="background-color: #00FF88; color: #041833; font-weight: bold; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 0 10px #00FF88; flex-shrink: 0;">✓</span>
                    <span style="color: #FFFFFF; font-size: 1rem; font-weight: 600; font-family: 'Space Grotesk', sans-serif;">{{ message }}</span>
                </div>
            {% endfor %}
            <div class="cabecalho__busca">
                <div class="busca__fundo">
                    <form action="{% url 'buscar' %}">
                        <input  class="busca__input" type="text" name="buscar" placeholder="O que você procura?">
                        <button type="submit">
                            <img class="busca__icone" src="{% static 'assets/icones/1x/search.png' %}" alt="ícone de search">
                        </button>
                    </form>
                </div>
            </div>
        </header>
        <main class="principal">
            <section class="menu-lateral">
                <nav class="menu-lateral__navegacao">
                    <a href="{% url 'index' %}"><img src="{% static 'assets/icones/1x/Home - ativo.png' %}"> Home</a>
                    <a href="{% url 'login' %}"><img src="{% static 'assets/icones/1x/Mais vistas - inativo.png' %}"> Login</a>
                    <a href="{% url 'cadastro' %}"><img src="{% static 'assets/icones/1x/Novas - inativo.png' %}"> Cadastrar</a>
                    <a href="#"><img src="{% static 'assets/icones/1x/Surpreenda-me - inativo.png' %}"> Logout</a>
                </nav>
            </section>
            <section class="galeria" style="margin-left: 5em">
                <form action="{% url 'cadastro' %}" method="post">
                    {% csrf_token %}
                    <div class="row">
                        {% for field in form.visible_fields %}
                        <div class="col-12 col-lg-12" style="margin-bottom: 10px;">
                            <label  style="color:#D9D9D9; margin-bottom: 5px; display: block;" for="{{field.id_for_label}}">
                                {{ field.label}}
                                {{ field }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    <div>
                       <button class="btn btn-success col-12" style="padding: top 5px;" type="submit">Cadastrar</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
{% include 'galeria/partials/_footer.html' %}
</body>
</html>
